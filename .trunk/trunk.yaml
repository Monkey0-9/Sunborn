# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.29.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - actionlint@1.7.12
    - bandit@1.9.4
    - black@26.10.1
    - checkov@3.4.5
    - clippy@1.65.0
    - git-diff-check
    - grype@0.121.3
    - hadolint@2.15.1
    - isort@9.0.2
    - markdownlint@0.50.0
    - osv-scanner@2.7.1
    # Trunk's pinact runner (plugin v1.11.0) invokes `pinact run -format sarif`.
    # pinact v5 requires two dashes for long flags, so stay on the 4.x line
    # (known_good_version 4.0.0) until the plugin wrapper is updated.
    - pinact@4.1.1
    - prettier@3.10.1
    - ruff@0.17.5
    - rustfmt@1.65.0
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - taplo@0.10.0
    - trufflehog@3.99.9
    - yamllint@1.38.0
