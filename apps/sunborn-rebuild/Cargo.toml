[package]
name = "sunborn-rebuild"
description = "Disaster recovery utility to rebuild discardable L2 DragonflyDB and Qdrant accelerators from authoritative PostgreSQL WAL"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["disaster-recovery", "rebuild", "cache-rebuild", "wal-hydration"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "sunborn-rebuild"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
sunborn-core = { path = "../../crates/sunborn-core" }
sunborn-db = { path = "../../crates/sunborn-db" }
sunborn-cache = { path = "../../crates/sunborn-cache" }
sunborn-semantic = { path = "../../crates/sunborn-semantic" }
