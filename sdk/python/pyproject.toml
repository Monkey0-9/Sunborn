[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sunborn"
version = "1.0.0"
description = "Enterprise semantic caching and execution reuse SDK for AI and agentic workflows"
readme = "README.md"
authors = [{ name = "Sunborn Team", email = "engineering@sunborn.ai" }]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["ai", "llm", "semantic-cache", "rag", "agent", "execution-reuse"]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
]

[project.scripts]
sunborn = "sunborn.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/Monkey0-9/Sunborn"
Documentation = "https://github.com/Monkey0-9/Sunborn#readme"
Repository = "https://github.com/Monkey0-9/Sunborn.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["sunborn*"]

[tool.setuptools.package-data]
sunborn = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["dist", "build", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
# The formatter owns line length; E501 in lint would double-report it.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test modules insert the SDK root on sys.path before importing it.
"tests/*" = ["E402", "F401", "F841", "B011"]
"examples/*" = ["E402"]
"sunborn_agent.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
files = ["sunborn"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
# Keep type-checking focused on this package instead of walking site-packages.
follow_imports = "skip"

[tool.coverage.run]
source = ["sunborn"]

[tool.coverage.report]
show_missing = true
skip_covered = true
