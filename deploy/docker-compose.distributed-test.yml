# Services for scripts/test_distributed_invalidation.sh.
# The gateways themselves run as two independent host processes so the test
# exercises the real Redis Streams transport, not an in-process broadcast.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sunborn
      POSTGRES_USER: sunborn
      POSTGRES_PASSWORD: sunborn_dist_test_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunborn -d sunborn"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.10.0
    ports:
      - "127.0.0.1:56333:6333"
