version: '3.8'

services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: sunborn-gateway
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      SUNBORN_DB_BACKEND: "${SUNBORN_DB_BACKEND:-postgres}"
      POSTGRES_URL: "postgres://${POSTGRES_USER:-sunborn}:${POSTGRES_PASSWORD:-dev_insecure_postgres_password}@postgres:5432/${POSTGRES_DB:-sunborn}"
      SUNBORN_CACHE_BACKEND: "${SUNBORN_CACHE_BACKEND:-dragonfly}"
      DRAGONFLY_URL: "${DRAGONFLY_URL:-redis://dragonfly:6379}"
      SUNBORN_VECTOR_BACKEND: "${SUNBORN_VECTOR_BACKEND:-qdrant}"
      QDRANT_URL: "${QDRANT_URL:-http://qdrant:6333}"
      SUNBORN_ENV: "${SUNBORN_ENV:-development}"
      SUNBORN_MASTER_KEK: "${SUNBORN_MASTER_KEK:-dev_insecure_master_kek_32bytes_local}"
      SUNBORN_ADMIN_KEY: "${SUNBORN_ADMIN_KEY:-dev_insecure_admin_key_32bytes_local}"
      SUNBORN_LEARNING_HMAC_SECRET: "${SUNBORN_LEARNING_HMAC_SECRET:-dev_insecure_hmac_secret_32bytes_local}"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - sunborn-net

  postgres:
    image: postgres:16-alpine
    container_name: sunborn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-sunborn}"
      POSTGRES_USER: "${POSTGRES_USER:-sunborn}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-dev_insecure_postgres_password}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sunborn} -d ${POSTGRES_DB:-sunborn}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sunborn-net

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.20.0
    container_name: sunborn-dragonfly
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sunborn-net

  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: sunborn-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sunborn-net

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2
    container_name: sunborn-redpanda
    restart: unless-stopped
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:9644:9644"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sunborn-net

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: sunborn-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-dev_insecure_minio_user}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-dev_insecure_minio_password}"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sunborn-net

networks:
  sunborn-net:
    driver: bridge

volumes:
  pgdata:
  qdrant_data:
  minio_data:
