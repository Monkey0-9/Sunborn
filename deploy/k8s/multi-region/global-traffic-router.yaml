apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sunborn-global-ingress
  namespace: sunborn
  annotations:
    sunborn.io/verification-status: "design-only-not-for-production"
    sunborn.io/verification-note: "Routes to one region only; no health-based global failover is configured or proven"
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "64k"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  rules:
    - host: api.sunborn.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sunborn-gateway-us-east
                port:
                  number: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sunborn-global-cluster-mesh
  namespace: sunborn
data:
  CLUSTER_MESH_ENABLED: "true"
  ANTI_ENTROPY_INTERVAL_SECS: "5"
  CROSS_REGION_LEASE_TIMEOUT_MS: "3000"
  ROUTING_POLICY: "latency-optimized-failover"
