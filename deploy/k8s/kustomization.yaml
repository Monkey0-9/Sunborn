apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sunborn-system

# `labels` with includeSelectors reproduces the old commonLabels behaviour
# exactly (they were already injected into selectors) without the v5 deprecation.
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: sunborn
      app.kubernetes.io/part-of: sunborn-platform
      app.kubernetes.io/managed-by: kustomize

resources:
  - configmap.yaml
  - service.yaml
  - deployment.yaml
  - frontend-deployment.yaml
  - pdb.yaml
  - ingress.yaml
  - hpa.yaml
  - pgbouncer.yaml
  - networkpolicy.yaml
  - prometheusrule.yaml
