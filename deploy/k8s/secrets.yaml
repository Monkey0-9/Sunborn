apiVersion: v1
kind: Secret
metadata:
  name: sunborn-gateway-secrets
  namespace: sunborn-system
  labels:
    app.kubernetes.io/name: sunborn-gateway
    app.kubernetes.io/part-of: sunborn
type: Opaque
stringData:
  POSTGRES_URL: "postgres://sunborn:CHANGE_ME_IN_PRODUCTION@sunborn-postgres.sunborn-system.svc.cluster.local:5432/sunborn"
  SUNBORN_ADMIN_KEY: "CHANGE_ME_ADMIN_KEY_VAULT_PROVISIONED"
  SUNBORN_MASTER_KEK: "CHANGE_ME_32BYTE_HEX_ENCODED_MASTER_KEY_ENCRYPTION_KEY"
