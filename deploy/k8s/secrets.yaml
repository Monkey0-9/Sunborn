apiVersion: v1
kind: Secret
metadata:
  name: sunborn-gateway-secrets
  namespace: sunborn-system
  labels:
    app.kubernetes.io/name: sunborn-gateway
    app.kubernetes.io/part-of: sunborn
  annotations:
    description: "Template secret for Sunborn production. Must be provisioned externally (e.g., Vault, AWS Secrets Manager, or SealedSecrets) with high-entropy 256-bit keys."
type: Opaque
stringData:
  POSTGRES_URL: "postgres://sunborn:CHANGE_ME_VAULT_PROVISIONED_POSTGRES_PASSWORD@sunborn-postgres.sunborn-system.svc.cluster.local:5432/sunborn"
  SUNBORN_ADMIN_KEY: "CHANGE_ME_VAULT_PROVISIONED_HIGH_ENTROPY_ADMIN_KEY"
  SUNBORN_MASTER_KEK: "CHANGE_ME_VAULT_PROVISIONED_256BIT_HEX_MASTER_KEY_ENCRYPTION_KEY"
  SUNBORN_LEARNING_HMAC_SECRET: "CHANGE_ME_VAULT_PROVISIONED_256BIT_HEX_LEARNING_HMAC_SECRET"
