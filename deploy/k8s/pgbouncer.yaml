# PgBouncer in transaction-pooling mode, fronting PostgreSQL for the gateway.
#
# Why this exists: every gateway pod opens its own pool of server connections.
# At the replica counts the HPA allows, those pools sum to far more backends
# than PostgreSQL (or a managed instance's max_connections) will accept, and the
# surplus requests queue inside the database where nothing can shed load. Putting
# a transaction-mode pooler in front decouples client concurrency from server
# connections: 5,000 client connections share 50 backends.
#
# Transaction pooling matches how the gateway actually talks to PostgreSQL:
# each request takes one connection, runs a statement or an explicit
# transaction, and releases it. Session state is not carried between requests.
#
# The auth file is NOT in this repository. It is supplied by an external secret
# manager as the Secret `sunborn-pgbouncer-auth` (key: userlist.txt), matching
# the convention in secrets.yaml.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sunborn-pgbouncer-config
  namespace: sunborn-system
data:
  pgbouncer.ini: |
    [databases]
    ; Point this at the managed PostgreSQL endpoint. Override `host` with a
    ; kustomize patch for the environment; it is not a credential.
    sunborn = host=sunborn-postgres port=5432 dbname=sunborn

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer-auth/userlist.txt
    pool_mode = transaction

    ; Client concurrency is cheap; server connections are not.
    max_client_conn = 5000
    default_pool_size = 50
    min_pool_size = 10
    reserve_pool_size = 10
    reserve_pool_timeout = 3

    ; Shed load instead of queueing forever: a client waiting longer than this
    ; for a backend receives an error the gateway can translate into 503.
    query_wait_timeout = 10
    server_idle_timeout = 60
    server_lifetime = 3600

    ; Always return a backend to a clean state between transactions.
    server_reset_query = DISCARD ALL
    ignore_startup_parameters = extra_float_digits,options

    log_connections = 0
    log_disconnections = 0
    stats_period = 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunborn-pgbouncer
  namespace: sunborn-system
  labels:
    app.kubernetes.io/name: sunborn-pgbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sunborn-pgbouncer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sunborn-pgbouncer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.23.1-p2
          args: ["/etc/pgbouncer/pgbouncer.ini"]
          ports:
            - name: postgres
              containerPort: 6432
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer
              readOnly: true
            - name: auth
              mountPath: /etc/pgbouncer-auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: sunborn-pgbouncer-config
            items:
              - key: pgbouncer.ini
                path: pgbouncer.ini
        - name: auth
          secret:
            secretName: sunborn-pgbouncer-auth
            items:
              - key: userlist.txt
                path: userlist.txt
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sunborn-pgbouncer
  namespace: sunborn-system
  labels:
    app.kubernetes.io/name: sunborn-pgbouncer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sunborn-pgbouncer
  ports:
    - name: postgres
      port: 6432
      targetPort: 6432
