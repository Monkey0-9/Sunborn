apiVersion: v1
kind: Service
metadata:
  name: sunborn-gateway
  namespace: sunborn-system
  labels:
    app.kubernetes.io/name: sunborn-gateway
    app.kubernetes.io/part-of: sunborn
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: sunborn-gateway
