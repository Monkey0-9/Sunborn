apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunborn-frontend
  namespace: sunborn-system
  labels:
    app.kubernetes.io/name: sunborn-frontend
    app.kubernetes.io/part-of: sunborn
    app.kubernetes.io/component: control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sunborn-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sunborn-frontend
        app.kubernetes.io/component: control-plane
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: frontend
          image: ghcr.io/sunborn/sunborn-frontend:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: SUNBORN_GATEWAY_URL
              value: "http://sunborn-gateway:8080"
          envFrom:
            - secretRef:
                name: sunborn-gateway-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sunborn-frontend
  namespace: sunborn-system
  labels:
    app.kubernetes.io/name: sunborn-frontend
    app.kubernetes.io/part-of: sunborn
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: sunborn-frontend
