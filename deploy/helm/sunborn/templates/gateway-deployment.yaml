apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sunborn.fullname" . }}-gateway
  labels:
    {{- include "sunborn.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- if not .Values.gateway.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "sunborn.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "sunborn.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      terminationGracePeriodSeconds: {{ .Values.gateway.terminationGracePeriodSeconds | default 30 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- if .Values.gateway.podSecurityContext }}
        {{- toYaml .Values.gateway.podSecurityContext | nindent 8 }}
        {{- else }}
        runAsNonRoot: {{ .Values.gateway.securityContext.runAsNonRoot | default true }}
        runAsUser: {{ .Values.gateway.securityContext.runAsUser | default 65532 }}
        runAsGroup: {{ .Values.gateway.securityContext.runAsGroup | default 65532 }}
        {{- end }}
      containers:
        - name: gateway
          securityContext:
            {{- if .Values.gateway.containerSecurityContext }}
            {{- toYaml .Values.gateway.containerSecurityContext | nindent 12 }}
            {{- else }}
            allowPrivilegeEscalation: {{ .Values.gateway.securityContext.allowPrivilegeEscalation | default false }}
            readOnlyRootFilesystem: {{ .Values.gateway.securityContext.readOnlyRootFilesystem | default true }}
            capabilities:
              {{- toYaml .Values.gateway.securityContext.capabilities | nindent 14 }}
            {{- end }}
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "sunborn.fullname" . }}-config
            - secretRef:
                name: {{ default (printf "%s-secrets" (include "sunborn.fullname" .)) .Values.secrets.existingSecret }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            {{- toYaml .Values.gateway.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.gateway.readinessProbe | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
