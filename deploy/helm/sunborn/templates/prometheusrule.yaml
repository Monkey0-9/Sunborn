{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "sunborn.fullname" . }}-alerts
  labels:
    {{- include "sunborn.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: sunborn-gateway.rules
      rules:
        # Alert 1: Free-Tier Quota & Global Pool Exhaustion
        - alert: SunbornTenantQuotaExhaustionCritical
          expr: rate(sunborn_quota_exceeded_total[5m]) > 0.5
          for: 2m
          labels:
            severity: {{ .Values.prometheusRule.severity.warning }}
            tier: gateway
          annotations:
            summary: "High quota rejection rate observed on Sunborn gateway"
            description: "Quota rejections exceeded 0.5/s over 2m. Review tenant quota allocations or global free pool ceilings."
            runbook_url: "https://github.com/Monkey0-9/Sunborn/blob/main/docs/runbooks/incident_playbooks.md#playbook-1-free-tier-quota--global-pool-exhaustion"

        # Alert 2: Upstream Provider Outage & Throttling
        - alert: SunbornUpstreamOriginLatencySpike
          expr: histogram_quantile(0.95, sum(rate(sunborn_request_duration_seconds_bucket[5m])) by (le)) > 2.5
          for: 3m
          labels:
            severity: {{ .Values.prometheusRule.severity.warning }}
            tier: gateway
          annotations:
            summary: "Upstream origin P95 latency exceeded 2.5s"
            description: "Upstream LLM provider latency is degrading client request processing."
            runbook_url: "https://github.com/Monkey0-9/Sunborn/blob/main/docs/runbooks/incident_playbooks.md#playbook-2-upstream-llm-provider-outage--severe-throttling"

        # Alert 3: Cache Store Circuit Breaker Trip
        - alert: SunbornCacheStoreCircuitBreakerOpen
          expr: sunborn_cache_circuit_breaker_status == 1
          for: 30s
          labels:
            severity: {{ .Values.prometheusRule.severity.critical }}
            tier: cache
          annotations:
            summary: "Sunborn cache store circuit breaker is OPEN"
            description: "Distributed cache cluster (DragonflyDB/Redis) is unreachable; gateway has failed-through to origin."
            runbook_url: "https://github.com/Monkey0-9/Sunborn/blob/main/docs/runbooks/incident_playbooks.md#playbook-3-distributed-cache-store-outage-dragonflydb--redis"

        # Alert 4: Semantic Tier Degradation
        - alert: SunbornSemanticTierDegraded
          expr: rate(sunborn_semantic_eval_failures_total[5m]) > 0.1
          for: 2m
          labels:
            severity: {{ .Values.prometheusRule.severity.warning }}
            tier: vector
          annotations:
            summary: "Semantic tier is failing and every request is going to origin"
            description: "Embedding or vector-store errors forced semantic evaluation to abstain. Requests still succeed, but cache hit rate and origin cost are silently degraded."
            runbook_url: "https://github.com/Monkey0-9/Sunborn/blob/main/docs/runbooks/incident_playbooks.md#playbook-4-vector-store-qdrant-outage--exact-path-fallback"

        # Alert 5: Distributed Spend Ledger Outage
        - alert: SunbornPostgresConnectionPoolExhausted
          expr: rate(sunborn_spend_ledger_errors_total[5m]) > 0.05
          for: 1m
          labels:
            severity: {{ .Values.prometheusRule.severity.critical }}
            tier: database
          annotations:
            summary: "Spend ledger reservation failure; failing closed"
            description: "PostgreSQL advisory lock or transaction pool error prevented spend pre-authorization."
            runbook_url: "https://github.com/Monkey0-9/Sunborn/blob/main/docs/runbooks/incident_playbooks.md#playbook-5-distributed-spend-ledger-outage--advisory-lock-contention"

        # Alert 6: Outbox DLQ Accumulation
        - alert: SunbornInvalidationDLQCountHigh
          expr: sunborn_invalidation_dlq > 0
          for: 5m
          labels:
            severity: {{ .Values.prometheusRule.severity.warning }}
            tier: invalidation
          annotations:
            summary: "Outbox events exhausted retries and are parked in FAILED state"
            description: "Durable invalidation events did not complete after max_retries. Replay them with POST /v1/lifecycle/outbox/replay once the downstream store is healthy; stale entries may be served until then."
            runbook_url: "https://github.com/Monkey0-9/Sunborn/blob/main/docs/runbooks/incident_playbooks.md#playbook-6-invalidation-outbox-dlq-accumulation"

        # Alert 7: Invalidation Left Stale Keys
        - alert: SunbornInvalidationPartialFailure
          expr: increase(sunborn_invalidation_partial_failures_total[5m]) > 0
          for: 1m
          labels:
            severity: {{ .Values.prometheusRule.severity.critical }}
            tier: invalidation
          annotations:
            summary: "Invalidation left stale keys behind"
            description: "At least one cache key or dependency edge could not be evicted. Stale entries may be served until the next successful invalidation; inspect the response `failed_keys` field for the failing store."
            runbook_url: "https://github.com/Monkey0-9/Sunborn/blob/main/docs/runbooks/incident_playbooks.md#playbook-7-partial-invalidation-stale-keys-left-behind"
{{- end }}
