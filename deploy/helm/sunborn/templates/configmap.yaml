apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sunborn.fullname" . }}-config
  labels:
    {{- include "sunborn.labels" . | nindent 4 }}
data:
  SUNBORN_ENV: {{ .Values.env.SUNBORN_ENV | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
  PORT: {{ .Values.env.PORT | quote }}
  SUNBORN_CACHE_BACKEND: {{ .Values.env.SUNBORN_CACHE_BACKEND | default "dragonfly" | quote }}
  SUNBORN_DB_BACKEND: {{ .Values.env.SUNBORN_DB_BACKEND | default "postgres" | quote }}
  SUNBORN_VECTOR_BACKEND: {{ .Values.env.SUNBORN_VECTOR_BACKEND | default "qdrant" | quote }}
  DRAGONFLY_URL: {{ .Values.env.DRAGONFLY_URL | quote }}
  REDIS_URL: {{ .Values.env.REDIS_URL | quote }}
  POSTGRES_URL: {{ .Values.env.POSTGRES_URL | quote }}
  DATABASE_URL: {{ .Values.env.DATABASE_URL | quote }}
  QDRANT_URL: {{ .Values.env.QDRANT_URL | quote }}
  SUNBORN_EMBEDDING_URL: {{ .Values.env.SUNBORN_EMBEDDING_URL | quote }}
  SUNBORN_EMBEDDING_MODEL: {{ .Values.env.SUNBORN_EMBEDDING_MODEL | default "text-embedding-3-small" | quote }}
  OPENAI_API_BASE: {{ .Values.env.OPENAI_API_BASE | quote }}
  EMBEDDING_PROVIDER: {{ .Values.env.EMBEDDING_PROVIDER | quote }}
  EMBEDDING_API_URL: {{ .Values.env.EMBEDDING_API_URL | quote }}
  EMBEDDING_DIMENSIONS: {{ .Values.env.EMBEDDING_DIMENSIONS | quote }}
  DECISION_EXACT_ONLY: {{ .Values.env.DECISION_EXACT_ONLY | quote }}
  DECISION_SIMILARITY_THRESHOLD: {{ .Values.env.DECISION_SIMILARITY_THRESHOLD | quote }}
  DECISION_MAX_RISK: {{ .Values.env.DECISION_MAX_RISK | quote }}
  EPOCH_LEASE_TTL_SECS: {{ .Values.env.EPOCH_LEASE_TTL_SECS | quote }}
  KMS_PROVIDER: {{ .Values.env.KMS_PROVIDER | quote }}
  VAULT_TRANSIT_KEY_NAME: {{ .Values.env.VAULT_TRANSIT_KEY_NAME | quote }}
