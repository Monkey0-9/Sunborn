apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sunborn.fullname" . }}-secrets
  labels:
    {{- include "sunborn.labels" . | nindent 4 }}
type: Opaque
stringData:
  SUNBORN_ADMIN_KEY: {{ .Values.secrets.sunbornAdminKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  SUNBORN_MASTER_KEK: {{ .Values.secrets.masterKek | quote }}
  MASTER_KEK: {{ .Values.secrets.masterKek | quote }}
  SUNBORN_LEARNING_HMAC_SECRET: {{ (.Values.secrets.learningHmacSecret | default .Values.secrets.masterKek) | quote }}
