{{- if not .Values.secrets.existingSecret -}}
{{- if not .Values.secrets.sunbornAdminKey }}
{{- fail "FAIL-CLOSED: .Values.secrets.sunbornAdminKey is required and cannot be empty. Supply a secure 256-bit admin key or set .Values.secrets.existingSecret." }}
{{- end }}
{{- if or (contains "replace-" .Values.secrets.sunbornAdminKey) (contains "changeme" .Values.secrets.sunbornAdminKey) (contains "placeholder" .Values.secrets.sunbornAdminKey) (contains "dev-" .Values.secrets.sunbornAdminKey) }}
{{- fail "FAIL-CLOSED: .Values.secrets.sunbornAdminKey contains an insecure placeholder or dev key. A cryptographically secure production key is required." }}
{{- end }}

{{- if not .Values.secrets.masterKek }}
{{- fail "FAIL-CLOSED: .Values.secrets.masterKek is required and cannot be empty. Supply a high-entropy 256-bit KEK or set .Values.secrets.existingSecret." }}
{{- end }}
{{- if or (contains "replace-" .Values.secrets.masterKek) (contains "changeme" .Values.secrets.masterKek) (contains "placeholder" .Values.secrets.masterKek) (contains "dev-" .Values.secrets.masterKek) }}
{{- fail "FAIL-CLOSED: .Values.secrets.masterKek contains an insecure placeholder or dev key. A cryptographically secure production key is required." }}
{{- end }}

{{- if not .Values.secrets.learningHmacSecret }}
{{- fail "FAIL-CLOSED: .Values.secrets.learningHmacSecret is required and cannot be empty. Supply a distinct 256-bit HMAC secret or set .Values.secrets.existingSecret." }}
{{- end }}
{{- if or (contains "replace-" .Values.secrets.learningHmacSecret) (contains "changeme" .Values.secrets.learningHmacSecret) (contains "placeholder" .Values.secrets.learningHmacSecret) (contains "dev-" .Values.secrets.learningHmacSecret) }}
{{- fail "FAIL-CLOSED: .Values.secrets.learningHmacSecret contains an insecure placeholder or dev key." }}
{{- end }}

{{- if not .Values.secrets.postgresUrl }}
{{- fail "FAIL-CLOSED: .Values.secrets.postgresUrl is required when existingSecret is not configured. Supply a secure PostgreSQL connection URL or set .Values.secrets.existingSecret." }}
{{- end }}
{{- if or (contains "change_in_vault" .Values.secrets.postgresUrl) (contains "placeholder" .Values.secrets.postgresUrl) (contains "dev-" .Values.secrets.postgresUrl) }}
{{- fail "FAIL-CLOSED: .Values.secrets.postgresUrl contains an insecure placeholder ('change_in_vault'). A valid production database URL is required." }}
{{- end }}

{{- if eq .Values.secrets.learningHmacSecret .Values.secrets.masterKek }}
{{- fail "FAIL-CLOSED: Key separation violation: .Values.secrets.learningHmacSecret must NOT equal .Values.secrets.masterKek. Key material must not be reused across distinct security purposes." }}
{{- end }}
{{- if eq .Values.secrets.sunbornAdminKey .Values.secrets.masterKek }}
{{- fail "FAIL-CLOSED: Key separation violation: .Values.secrets.sunbornAdminKey must NOT equal .Values.secrets.masterKek." }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sunborn.fullname" . }}-secrets
  labels:
    {{- include "sunborn.labels" . | nindent 4 }}
type: Opaque
stringData:
  SUNBORN_ADMIN_KEY: {{ .Values.secrets.sunbornAdminKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  SUNBORN_MASTER_KEK: {{ .Values.secrets.masterKek | quote }}
  MASTER_KEK: {{ .Values.secrets.masterKek | quote }}
  SUNBORN_LEARNING_HMAC_SECRET: {{ .Values.secrets.learningHmacSecret | quote }}
  POSTGRES_URL: {{ .Values.secrets.postgresUrl | quote }}
  DATABASE_URL: {{ .Values.secrets.postgresUrl | quote }}
{{- end }}
