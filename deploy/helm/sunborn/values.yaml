# Default values for sunborn enterprise deployment.
global:
  environment: production
  imageRegistry: ghcr.io
  imagePullSecrets: []

gateway:
  replicaCount: 3
  image:
    repository: ghcr.io/sunborn/sunborn-gateway
    pullPolicy: IfNotPresent
    tag: "0.1.0"

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /ready
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2

frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/sunborn/sunborn-frontend
    pullPolicy: IfNotPresent
    tag: "0.1.0"

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi

  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 15

  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 5

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: sunborn.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /v1
          pathType: Prefix
          service: gateway
  tls:
    - secretName: sunborn-tls-cert
      hosts:
        - sunborn.example.com

env:
  SUNBORN_ENV: "production"
  LOG_LEVEL: "info,sunborn_gateway=info"
  PORT: "8080"
  SUNBORN_CACHE_BACKEND: "dragonfly"
  SUNBORN_DB_BACKEND: "postgres"
  SUNBORN_VECTOR_BACKEND: "qdrant"
  DRAGONFLY_URL: "redis://sunborn-dragonfly:6379"
  REDIS_URL: "redis://sunborn-dragonfly:6379"
  QDRANT_URL: "http://sunborn-qdrant:6333"
  SUNBORN_EMBEDDING_URL: "http://sunborn-embedder:8000/v1/embeddings"
  EMBEDDING_API_URL: "http://sunborn-embedder:8000/v1/embeddings"
  SUNBORN_EMBEDDING_MODEL: "text-embedding-3-small"
  OPENAI_API_BASE: "https://api.openai.com/v1"
  EMBEDDING_PROVIDER: "http"
  EMBEDDING_DIMENSIONS: "1536"
  DECISION_EXACT_ONLY: "false"
  DECISION_SIMILARITY_THRESHOLD: "0.85"
  DECISION_MAX_RISK: "0.05"
  EPOCH_LEASE_TTL_SECS: "60"
  KMS_PROVIDER: "vault-transit"
  VAULT_TRANSIT_KEY_NAME: "sunborn-cluster-kek"

secrets:
  # Reference to an existing Kubernetes Secret containing SUNBORN_ADMIN_KEY, SUNBORN_MASTER_KEK, SUNBORN_LEARNING_HMAC_SECRET.
  # Recommended for production deployments (e.g. HashiCorp Vault, AWS Secrets Manager, or ExternalSecrets operator).
  existingSecret: ""

  # When existingSecret is NOT used, the following keys must be supplied explicitly.
  # Default is EMPTY: Helm template/install fails closed if required keys are missing or contain placeholder values.
  sunbornAdminKey: ""
  openaiApiKey: ""
  masterKek: ""
  learningHmacSecret: ""

networkPolicy:
  enabled: true
  allowEgressToExternalLLM: true
  # Ingress controller namespace selector (restricted rather than cluster-wide wildcard)
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
  # Monitoring namespace selector for Prometheus ServiceMonitor scraping (/metrics)
  monitoringNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring
  # Optional selector for backend databases if deployed in separate namespace
  backendNamespaceSelector: {}

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
