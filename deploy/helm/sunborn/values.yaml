# Default values for sunborn enterprise deployment.
global:
  environment: production
  imageRegistry: ghcr.io
  imagePullSecrets: []

gateway:
  replicaCount: 3
  image:
    repository: ghcr.io/monkey0-9/sunborn-gateway
    pullPolicy: IfNotPresent
    tag: "0.1.0"

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /ready
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2

frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/monkey0-9/sunborn-frontend
    pullPolicy: IfNotPresent
    tag: "0.1.0"

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 15

  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 5

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: sunborn.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /v1
          pathType: Prefix
          service: gateway
        - path: /metrics
          pathType: Prefix
          service: gateway
  tls:
    - secretName: sunborn-tls-cert
      hosts:
        - sunborn.example.com

env:
  SUNBORN_ENV: "production"
  LOG_LEVEL: "info,sunborn_gateway=info"
  PORT: "8080"
  DATABASE_URL: "postgres://sunborn_app:change_me_in_secret@sunborn-postgres:5432/sunborn_prod"
  REDIS_URL: "redis://sunborn-dragonfly:6379"
  QDRANT_URL: "http://sunborn-qdrant:6333"
  OPENAI_API_BASE: "https://api.openai.com/v1"
  EMBEDDING_PROVIDER: "http"
  EMBEDDING_API_URL: "http://sunborn-embedder:8000/v1/embeddings"
  EMBEDDING_DIMENSIONS: "1536"
  DECISION_EXACT_ONLY: "false"
  DECISION_SIMILARITY_THRESHOLD: "0.85"
  DECISION_MAX_RISK: "0.05"
  EPOCH_LEASE_TTL_SECS: "60"
  KMS_PROVIDER: "vault-transit"
  VAULT_TRANSIT_KEY_NAME: "sunborn-cluster-kek"

secrets:
  sunbornAdminKey: "replace-with-cryptographically-secure-32byte-hex-admin-key"
  openaiApiKey: ""
  masterKek: "replace-with-256bit-master-kek-hex"

networkPolicy:
  enabled: true
  allowIngressFromCluster: true
  allowEgressToExternalLLM: true

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
