[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "sunborn-paper-latex-mcp"
version = "0.2.0"
description = "Direct LaTeX manuscript editing and latexmk builds for Sunborn research agents"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
sunborn-latex-mcp = "sunborn_latex_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sunborn_latex_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
