      summary: Trigger Invalidation Event
      description: Evicts dependent cache entries and advances epoch watermark across the invalidation DAG.
      tags:
        - Invalidation
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - source_id
                - source_type
              properties:
                source_id:
                  type: string
                  format: uuid
                  example: "a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d"
                source_type:
                  type: string
                  example: "postgres.public.documents"
                tenant_id:
                  type: string
                  nullable: true
                  example: "tenant-enterprise-alpha"
      responses:
        '200':
          description: Invalidation processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "processed"
                  source_id:
                    type: string
                    format: uuid
                  bumped_epoch:
                    type: integer
                  bumped_watermark:
                    type: integer
                  evicted_cache_count:
                    type: integer
        '400':
          description: Malformed invalidation payload
        '401':
          description: Unauthorized
        '403':
          description: Administrative privileges required

