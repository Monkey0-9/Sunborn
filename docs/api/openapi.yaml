      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mutated_roots
              properties:
                mutated_roots:
                  type: array
                  description: Node ids whose content changed
                  items:
                    type: string
                max_depth:
                  type: integer
                  description: Traversal depth limit
                allowed_relations:
                  type: array
                  description: Restrict traversal to these relation kinds
                include_cache_entries:
                  type: boolean
                  description: Include affected cache keys in the report
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  affected_nodes:
                    type: array
                    items:
                      type: string
                  affected_cache_keys:
                    type: array
                    items:
                      type: string
                  max_depth_reached:
                    type: integer
