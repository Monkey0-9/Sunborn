                  mode:
                    type: string
                    example: "local_byok"
                  configured_providers:
                    type: array
                    items:
                      type: object

  /v1/local/providers:
    post:
      summary: Save Local BYOK Provider API Key
      description: Encrypts and securely stores provider API key into OS native credential vault.
      tags:
        - LocalBYOK
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider
                - api_key
              properties:
                provider:
                  type: string
                  example: "openai"
                api_key:
                  type: string
                  example: "sk-proj-..."
                base_url:
                  type: string
                  nullable: true
                default_model:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Provider saved successfully with masked key preview
          content:
            application/json:
              schema:
                type: object

