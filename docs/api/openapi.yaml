                - execution_latency_ms
              properties:
                tenant_id:
                  type: string
                application_id:
                  type: string
                tool_name:
                  type: string
                tool_version:
                  type: string
                arguments:
                  type: object
                  description: Tool arguments, preserved as arbitrary JSON.
                output:
                  description: Tool output, preserved as arbitrary JSON.
                is_error:
                  type: boolean
                execution_latency_ms:
                  type: integer
                  format: int64
                  minimum: 0
                context_hash:
                  type: string
                  nullable: true
                ttl_secs:
                  type: integer
                  format: int64
                  minimum: 0
                  nullable: true
      responses:
        '200':
          description: Tool result cached
          content:
            application/json:
              schema:
                type: object
                required:
                  - signature
                  - status
                properties:
                  signature:
                    type: string
                  status:
                    type: string
                    enum:
                      - stored
        '401':
          description: Unauthorized
        '403':
          description: Tenant boundary violation

