name: Production Release & Container Publishing

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  GATEWAY_IMAGE: ghcr.io/sunborn/sunborn-gateway
  FRONTEND_IMAGE: ghcr.io/sunborn/sunborn-frontend

jobs:
  verify-ci:
    name: Required CI verification
    uses: ./.github/workflows/ci.yml

  verify-security:
    name: Required security verification
    uses: ./.github/workflows/security.yml

  verify-release-chart:
    name: Verify chart images match release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.2
      - name: Package and render candidate chart
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          CHART_VERSION="${RELEASE_TAG#v}"
          mkdir -p /tmp/sunborn-release-chart
          helm lint deploy/helm/sunborn --set secrets.existingSecret="ci-validation"
          helm package deploy/helm/sunborn \
            --version "${CHART_VERSION}" \
            --app-version "${CHART_VERSION}" \
            --destination /tmp/sunborn-release-chart
          RENDERED=$(mktemp)
          helm template sunborn "/tmp/sunborn-release-chart/sunborn-${CHART_VERSION}.tgz" \
            --set secrets.existingSecret="ci-validation" > "${RENDERED}"
          grep -F "image: \"ghcr.io/sunborn/sunborn-gateway:${CHART_VERSION}\"" "${RENDERED}"
          grep -F "image: \"ghcr.io/sunborn/sunborn-frontend:${CHART_VERSION}\"" "${RENDERED}"

  package-windows-desktop:
    name: Build & Package Windows Desktop Distribution
    runs-on: windows-latest
    permissions:
      contents: write
      # Required by actions/attest-build-provenance to issue a signed SLSA
      # build-provenance attestation for the release artifact.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Build & Package Desktop Distribution
        shell: powershell
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (-not $ver) { $ver = "1.0.0" }
          .\scripts\package-distribution.ps1 -Version $ver
          .\scripts\verify-desktop-package.ps1 -DistDir target\dist -Version $ver

      - name: Verify Clean-Machine Installation & Smoke Test
        shell: powershell
        run: |
          $distZip = Get-ChildItem target\dist\sunborn-desktop-*-windows-x64.zip | Select-Object -First 1
          $testDir = "$env:TEMP\sunborn-clean-test"
          Expand-Archive -Path $distZip.FullName -DestinationPath $testDir -Force
          Push-Location $testDir
          try {
            $installProc = Start-Process -FilePath "powershell.exe" -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File .\install-sunborn.ps1 -Silent" -Wait -PassThru
            if ($installProc.ExitCode -ne 0) {
              throw "Installer exited with failure code: $($installProc.ExitCode)"
            }
            $targetBin = "$env:LOCALAPPDATA\Sunborn\bin\sunborn-gateway.exe"
            if (-not (Test-Path $targetBin)) {
              throw "Installed binary missing at $targetBin"
            }
            $ver = & $targetBin --version
            Write-Host "Installed binary verified: $ver"
            if ($LASTEXITCODE -ne 0) {
              throw "sunborn-gateway --version failed with exit code $LASTEXITCODE"
            }
            $uninstallScript = "$env:LOCALAPPDATA\Sunborn\uninstall.ps1"
            if (Test-Path $uninstallScript) {
              $uninstProc = Start-Process -FilePath "powershell.exe" -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `"$uninstallScript`" -Silent -PurgeData" -Wait -PassThru
              if ($uninstProc.ExitCode -ne 0) {
                Write-Warning "Uninstaller exited with code: $($uninstProc.ExitCode)"
              }
            }
          } finally {
            Pop-Location
            Remove-Item -Path $testDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Generate signed SLSA build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: target/dist/sunborn-desktop-*-windows-x64.zip

      - name: Upload Windows Desktop Release Asset
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: windows-desktop-package
          path: |
            target/dist/sunborn-desktop-*-windows-x64.zip
            target/dist/SHA256SUMS.txt
            target/dist/SHA512SUMS.txt
            target/dist/BUILD-METADATA.json
            target/dist/sbom.cyclonedx.json

  build-and-publish:
    name: Build Containers, Package Helm Chart & Publish Release
    needs: [verify-ci, verify-security, verify-release-chart, package-windows-desktop]
    runs-on: ubuntu-latest
    environment: release-approval
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify release tag format and commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH format."
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.2

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Gateway Container ---
      - name: Extract Metadata for Gateway
        id: meta-gateway
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.GATEWAY_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and Push Gateway Distroless Container
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta-gateway.outputs.tags }}
          labels: ${{ steps.meta-gateway.outputs.labels }}
          build-args: |
            SUNBORN_GIT_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Frontend Container ---
      - name: Extract Metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and Push Frontend Container
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: deploy/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Helm Chart Packaging ---
      - name: Lint and Package Helm Chart
        run: |
          mkdir -p dist/helm
          helm lint deploy/helm/sunborn --set secrets.existingSecret="release-validation"
          helm package deploy/helm/sunborn \
            --version "${GITHUB_REF_NAME#v}" \
            --app-version "${GITHUB_REF_NAME#v}" \
            --destination dist/helm

      # --- Windows Desktop Package ---
      - name: Download Windows Desktop Artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: windows-desktop-package
          path: dist/desktop

      # --- GitHub Release ---
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/helm/*.tgz
            dist/desktop/*.zip
            dist/desktop/*.txt
            dist/desktop/*.json
            research/results/reproduction_certificate.json
            research/results/benchmark_run.json
            research/results/run_manifest.json
