name: Sunborn CI & Quality Gate

permissions:
  contents: read

on:
  workflow_call:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  backend-verification:
    name: Rust Workspace Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify Code Formatting
        run: cargo fmt --all -- --check

      - name: Strict Clippy Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Full Unit & Integration Test Suite
        run: cargo test --all-targets --all-features

  frontend-verification:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies (Strict Lockfile)
        working-directory: frontend
        run: npm ci --audit=false

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Type Check Frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build

      - name: Run BFF Security and E2E Browser Tests
        working-directory: frontend
        env:
          CI: "true"
          STRICT_E2E: "true"
        run: npm test

  research-reproducibility:
    name: IEEE/ACM Scientific Reproducibility Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python SDK Unit Tests
        run: python3 -m unittest sdk/python/test_sunborn_agent.py

      - name: Run Verifier Negative Tests
        run: python3 -m unittest research/tests/test_verifier_negative.py

      - name: Execute Full Reproducibility Verification Suite
        run: bash research/reproduce.sh

  contract-and-sdk-verification:
    name: OpenAPI 3.1 & Python SDK Packaging Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install UV
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install PyYAML
        run: uv pip install --system pyyaml
      - name: Verify OpenAPI 3.1 Specification Drift
        run: python3 scripts/check_openapi_drift.py
      - name: Verify Python SDK Package & Clean Installation
        run: bash scripts/test_python_sdk.sh

  helm-and-manifest-verification:
    name: Helm & Deployment Manifest Verification Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.2'

      - name: Helm Lint Chart
        run: |
          helm lint deploy/helm/sunborn --set secrets.existingSecret="ci-validation"

      - name: Verify Helm image tags and external secret contract
        run: |
          RENDERED=$(mktemp)
          helm template sunborn deploy/helm/sunborn \
            --set secrets.existingSecret="ci-validation" > "${RENDERED}"
          grep -F 'image: "ghcr.io/sunborn/sunborn-gateway:0.1.0"' "${RENDERED}"
          grep -F 'image: "ghcr.io/sunborn/sunborn-frontend:0.1.0"' "${RENDERED}"
          grep -F 'key: SUNBORN_ADMIN_KEY' "${RENDERED}"
          grep -F 'key: SUNBORN_MASTER_KEK' "${RENDERED}"
          grep -F 'key: SUNBORN_LEARNING_HMAC_SECRET' "${RENDERED}"
          grep -F 'key: POSTGRES_URL' "${RENDERED}"

      - name: Check static Kubernetes manifests
        run: python3 scripts/check_k8s_manifests.py

      - name: Verify Fail-Closed on Missing Secrets
        run: |
          echo "Asserting that Helm template fails when secrets are absent..."
          if helm template sunborn deploy/helm/sunborn > /dev/null 2>&1; then
            echo "ERROR: Helm template succeeded without required secrets! Expected fail-closed behavior."
            exit 1
          else
            echo "PASS: Helm template correctly failed closed on missing production secrets."
          fi

      - name: Verify Fail-Closed on Missing Database URL
        run: |
          echo "Asserting that Helm template fails when postgresUrl is absent..."
          if helm template sunborn deploy/helm/sunborn \
            --set secrets.sunbornAdminKey="admin-prod-key-32b-secure-value" \
            --set secrets.masterKek="fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210" \
            --set secrets.learningHmacSecret="learning-hmac-32b-secure-value" > /dev/null 2>&1; then
            echo "ERROR: Helm template succeeded without postgresUrl! Expected fail-closed behavior."
            exit 1
          else
            echo "PASS: Helm template correctly failed closed on missing postgresUrl."
          fi

      - name: Verify Fail-Closed on Key Separation Violation
        run: |
          echo "Asserting that Helm template fails when learning HMAC secret equals master KEK..."
          if helm template sunborn deploy/helm/sunborn \
            --set secrets.sunbornAdminKey="admin-prod-key-32b-secure-value" \
            --set secrets.masterKek="fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210" \
            --set secrets.learningHmacSecret="fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210" \
            --set secrets.postgresUrl="postgresql://sunborn_admin:secret@sunborn-postgres:5432/sunborn" > /dev/null 2>&1; then
            echo "ERROR: Helm template succeeded with duplicate keys! Expected key separation failure."
            exit 1
          else
            echo "PASS: Helm template correctly rejected key reuse across master KEK and learning HMAC secret."
          fi

      - name: Verify Clean Template Rendering with Valid Secrets
        run: |
          RENDERED=$(mktemp)
          helm template sunborn deploy/helm/sunborn \
            --set secrets.sunbornAdminKey="admin-prod-key-32b-secure-value" \
            --set secrets.masterKek="fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210" \
            --set secrets.learningHmacSecret="learning-hmac-32b-secure-value" \
            --set secrets.postgresUrl="postgresql://sunborn_admin:secret@sunborn-postgres:5432/sunborn" > "${RENDERED}"

          echo "Verifying /metrics is NOT exposed on public Ingress..."
          if grep -A 5 "path: /metrics" "${RENDERED}" | grep -q "sunborn.example.com"; then
            echo "ERROR: /metrics is exposed on public ingress in rendered template!"
            exit 1
          else
            echo "PASS: /metrics is strictly excluded from public ingress."
          fi

          echo "Verifying NetworkPolicy narrows ingress namespace selectors..."
          if grep -A 15 "ingress:" "${RENDERED}" | grep -q "namespaceSelector: {}"; then
            echo "ERROR: Ingress NetworkPolicy still contains open namespace wildcard namespaceSelector: {}!"
            exit 1
          else
            echo "PASS: Ingress NetworkPolicy enforces least-privilege restricted namespace selectors."
          fi

          rm -f "${RENDERED}"

