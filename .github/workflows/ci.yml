name: Sunborn CI & Quality Gate

permissions:
  contents: read

on:
  workflow_call:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  backend-verification:
    name: Rust Workspace Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify Code Formatting
        run: cargo fmt --all -- --check

      - name: Strict Clippy Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Full Unit & Integration Test Suite
        run: cargo test --all-targets --all-features

  documentation-verification:
    name: Documentation Link & Claims Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify documentation paths, links, and claims
        run: |
          python3 scripts/verify_doc_paths.py --strict
          python3 scripts/check_launch_docs.py

  frontend-verification:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Cache Node modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies (Strict Lockfile)
        working-directory: frontend
        run: npm ci --audit=false

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Type Check Frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build

      - name: Run BFF Security and E2E Browser Tests
        working-directory: frontend
        env:
          CI: "true"
          STRICT_E2E: "true"
        run: npm test

      - name: Run Axe WCAG 2.2 AA Conformance Sweep
        working-directory: frontend
        env:
          CI: "true"
          STRICT_E2E: "true"
        run: npm run test:a11y

      - name: Run Keyboard and Focus Audit
        working-directory: frontend
        env:
          CI: "true"
          STRICT_E2E: "true"
        run: npm run test:keyboard

      - name: Verify TypeScript SDK Build & Tests
        run: |
          npm ci --prefix sdk/typescript
          npm run build --prefix sdk/typescript
          npm test --prefix sdk/typescript

  research-reproducibility:
    name: IEEE/ACM Scientific Reproducibility Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Unquoted for yamllint 'only-when-needed'. A version ending in 0
          # (3.10) would parse as a float; quote it and extend
          # extra-allowed in .trunk/configs/.yamllint.yaml instead.
          python-version: 3.11

      - name: Run Python SDK Unit Tests
        run: python3 -m unittest sdk/python/test_sunborn_agent.py

      - name: Run Verifier Negative Tests
        run: python3 -m unittest research/tests/test_verifier_negative.py

      - name: Run Conformal Calibration Dataset Tests
        run: python3 -m unittest research/tests/test_expand_dataset.py

      - name: Verify Conformal Calibration Dataset Integrity
        run: python3 research/calibration/expand_dataset.py --validate

      - name: Verify Isolated Live Benchmark Credentials
        run: python3 research/tests/test_benchmark_credentials.py

      - name: Execute Full Reproducibility Verification Suite
        run: bash research/reproduce.sh

  contract-and-sdk-verification:
    name: OpenAPI 3.1 & Python SDK Packaging Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Unquoted for yamllint 'only-when-needed'. A version ending in 0
          # (3.10) would parse as a float; quote it and extend
          # extra-allowed in .trunk/configs/.yamllint.yaml instead.
          python-version: 3.11
      - name: Install UV
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: latest
      - name: Install Python dev dependencies
        run: uv pip install --system -r requirements-dev.txt
      - name: Verify OpenAPI 3.1 Specification Drift
        run: python3 scripts/check_openapi_drift.py
      - name: Verify Python SDK Package & Clean Installation
        run: bash scripts/test_python_sdk.sh

  helm-and-manifest-verification:
    name: Helm & Deployment Manifest Verification Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.2

      - name: Helm Lint Chart
        run: |
          helm lint deploy/helm/sunborn --set secrets.existingSecret="ci-validation"

      - name: Verify Helm image tags and external secret contract
        run: |
          RENDERED=$(mktemp)
          helm template sunborn deploy/helm/sunborn \
            --set secrets.existingSecret="ci-validation" > "${RENDERED}"
          grep -F 'image: "ghcr.io/sunborn/sunborn-gateway:0.1.0"' "${RENDERED}"
          grep -F 'image: "ghcr.io/sunborn/sunborn-frontend:0.1.0"' "${RENDERED}"
          grep -F 'key: SUNBORN_ADMIN_KEY' "${RENDERED}"
          grep -F 'key: SUNBORN_MASTER_KEK' "${RENDERED}"
          grep -F 'key: SUNBORN_LEARNING_HMAC_SECRET' "${RENDERED}"
          grep -F 'key: POSTGRES_URL' "${RENDERED}"

      - name: Check static Kubernetes manifests
        run: python3 scripts/check_k8s_manifests.py

      - name: Verify Fail-Closed on Missing Secrets
        run: |
          echo "Asserting that Helm template fails when secrets are absent..."
          if helm template sunborn deploy/helm/sunborn > /dev/null 2>&1; then
            echo "ERROR: Helm template succeeded without required secrets! Expected fail-closed behavior."
            exit 1
          else
            echo "PASS: Helm template correctly failed closed on missing production secrets."
          fi

      - name: Verify Fail-Closed on Missing Database URL
        run: |
          echo "Asserting that Helm template fails when postgresUrl is absent..."
          if helm template sunborn deploy/helm/sunborn \
            --set secrets.sunbornAdminKey="admin-prod-key-32b-secure-value" \
            --set secrets.masterKek="fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210" \
            --set secrets.learningHmacSecret="learning-hmac-32b-secure-value" > /dev/null 2>&1; then
            echo "ERROR: Helm template succeeded without postgresUrl! Expected fail-closed behavior."
            exit 1
          else
            echo "PASS: Helm template correctly failed closed on missing postgresUrl."
          fi

      - name: Verify Fail-Closed on Key Separation Violation
        run: |
          echo "Asserting that Helm template fails when learning HMAC secret equals master KEK..."
          if helm template sunborn deploy/helm/sunborn \
            --set secrets.sunbornAdminKey="admin-prod-key-32b-secure-value" \
            --set secrets.masterKek="fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210" \
            --set secrets.learningHmacSecret="fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210" \
            --set secrets.postgresUrl="postgresql://sunborn_admin:secret@sunborn-postgres:5432/sunborn" > /dev/null 2>&1; then
            echo "ERROR: Helm template succeeded with duplicate keys! Expected key separation failure."
            exit 1
          else
            echo "PASS: Helm template correctly rejected key reuse across master KEK and learning HMAC secret."
          fi

      - name: Verify Clean Template Rendering with Valid Secrets
        run: |
          RENDERED=$(mktemp)
          helm template sunborn deploy/helm/sunborn \
            --set secrets.sunbornAdminKey="admin-prod-key-32b-secure-value" \
            --set secrets.masterKek="fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210" \
            --set secrets.learningHmacSecret="learning-hmac-32b-secure-value" \
            --set secrets.postgresUrl="postgresql://sunborn_admin:secret@sunborn-postgres:5432/sunborn" > "${RENDERED}"

          echo "Verifying /metrics is NOT exposed on public Ingress..."
          if grep -A 5 "path: /metrics" "${RENDERED}" | grep -q "sunborn.example.com"; then
            echo "ERROR: /metrics is exposed on public ingress in rendered template!"
            exit 1
          else
            echo "PASS: /metrics is strictly excluded from public ingress."
          fi

          echo "Verifying NetworkPolicy narrows ingress namespace selectors..."
          if grep -A 15 "ingress:" "${RENDERED}" | grep -q "namespaceSelector: {}"; then
            echo "ERROR: Ingress NetworkPolicy still contains open namespace wildcard namespaceSelector: {}!"
            exit 1
          else
            echo "PASS: Ingress NetworkPolicy enforces least-privilege restricted namespace selectors."
          fi

          rm -f "${RENDERED}"

  formal-verification:
    name: TLA+ Model Checking Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Model-check epoch fencing and outbox protocol
        run: bash scripts/run_tlaplus.sh

  distributed-invalidation-verification:
    name: Two-Replica Redis Streams Invalidation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-dist-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run live two-replica invalidation harness
        run: |
          DIST_MODE=exact bash scripts/test_distributed_invalidation.sh
          DIST_MODE=semantic bash scripts/test_distributed_invalidation.sh
          DIST_MODE=outbox bash scripts/test_distributed_invalidation.sh
          DIST_MODE=replay bash scripts/test_distributed_invalidation.sh
          DIST_MODE=finops bash scripts/test_distributed_invalidation.sh
          DIST_MODE=crash bash scripts/test_distributed_invalidation.sh

  windows-console-regression:
    name: Windows Console & Encoding Gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install UV
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: latest

      - name: Install Python dev dependencies
        run: python -m pip install -r requirements-dev.txt

      # These gates print non-ASCII progress marks from inline Python. On a
      # legacy Windows code page that aborts with UnicodeEncodeError, which is
      # a harness failure that reads like a product failure. The scripts pin
      # UTF-8 themselves; this job keeps them honest.
      - name: Run console-sensitive gates under the default Windows code page
        shell: bash
        run: |
          bash scripts/test_python_sdk.sh
          python scripts/check_openapi_drift.py
          bash deploy/verify_live_stack.sh
          python scripts/verify_doc_paths.py --strict

  database-migration-verification:
    name: Apply every migration to a real PostgreSQL
    runs-on: ubuntu-latest
    # Nothing else in this repository executes the migrations. Without this job
    # the 12 files under migrations/ are untested SQL: a syntax error, a column
    # that does not exist, or a constraint that never binds would be discovered
    # for the first time on a customer's upgrade.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sunborn_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: sunborn_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sunborn_ci -d sunborn_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    env:
      DATABASE_URL: postgresql://sunborn_ci:ci_only_password@localhost:5432/sunborn_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y postgresql-client
          fi

      - name: Apply migrations in filename order
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: no migrations found." >&2
            exit 1
          fi
          echo "Applying ${#files[@]} migrations to a blank database."
          for f in "${files[@]}"; do
            echo "  -> $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --quiet -f "$f"
          done
          echo "All migrations applied cleanly from an empty database."

      - name: Assert every migration produced its schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
              required_tables text[] := ARRAY[
                  'tenants', 'applications', 'api_credentials',
                  'spend_reservations', 'spend_ledger_entries',
                  'spend_tenant_ceilings', 'durable_cache_entries',
                  'outbox_events', 'dependency_edges', 'tenant_encryption_keys',
                  'tenant_erasure_tasks', 'learning_feedback_events'
              ];
              missing text;
          BEGIN
              SELECT string_agg(t, ', ') INTO missing
                FROM unnest(required_tables) AS t
               WHERE to_regclass(t) IS NULL;
              IF missing IS NOT NULL THEN
                  RAISE EXCEPTION 'migrations did not create: %', missing;
              END IF;
              RAISE NOTICE 'OK: all % required tables exist', array_length(required_tables, 1);
          END $$;
          SQL

      - name: Assert the micro-unit constraints exist and are validated
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
              expected text[] := ARRAY[
                  'spend_reservations_amount_micro_units_non_negative',
                  'spend_ledger_entries_amount_micro_units_non_negative',
                  'spend_tenant_ceilings_ceiling_micro_units_non_negative'
              ];
              found int;
          BEGIN
              SELECT count(*) INTO found
                FROM pg_constraint
               WHERE conname = ANY(expected)
                 AND convalidated;
              IF found <> array_length(expected, 1) THEN
                  RAISE EXCEPTION
                      'expected % validated constraints, found %',
                      array_length(expected, 1), found;
              END IF;
              RAISE NOTICE 'OK: all micro-unit constraints are validated';
          END $$;
          SQL

      - name: Assert negative micro-units are rejected by the database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- Each block inserts a negative amount and fails the job if the row is
          -- accepted instead of raising check_violation.
          DO $$
          BEGIN
              BEGIN
                  INSERT INTO spend_reservations(reservation_id, tenant_id, amount_usd, amount_micro_units)
                  VALUES (gen_random_uuid(), 'ci-tenant', 0, -1);
                  RAISE EXCEPTION 'spend_reservations accepted a negative amount_micro_units';
              EXCEPTION WHEN check_violation THEN
                  RAISE NOTICE 'OK: spend_reservations rejected negative micro-units';
              END;

              BEGIN
                  INSERT INTO spend_ledger_entries(tenant_id, reservation_id, amount_usd, amount_micro_units)
                  VALUES ('ci-tenant', gen_random_uuid(), 0, -1);
                  RAISE EXCEPTION 'spend_ledger_entries accepted a negative amount_micro_units';
              EXCEPTION WHEN check_violation THEN
                  RAISE NOTICE 'OK: spend_ledger_entries rejected negative micro-units';
              END;

              BEGIN
                  INSERT INTO spend_tenant_ceilings(tenant_id, ceiling_usd, ceiling_micro_units)
                  VALUES ('ci-tenant', 0, -1);
                  RAISE EXCEPTION 'spend_tenant_ceilings accepted a negative ceiling_micro_units';
              EXCEPTION WHEN check_violation THEN
                  RAISE NOTICE 'OK: spend_tenant_ceilings rejected negative micro-units';
              END;
          END $$;
          SQL

      - name: Assert a zero ceiling and a positive reservation are accepted
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --quiet <<'SQL'
          INSERT INTO spend_tenant_ceilings(tenant_id, ceiling_usd, ceiling_micro_units)
          VALUES ('ci-tenant-ok', 0, 0);
          INSERT INTO spend_reservations(reservation_id, tenant_id, amount_usd, amount_micro_units)
          VALUES (gen_random_uuid(), 'ci-tenant-ok', 0.000001, 1);
          SELECT 'OK: boundary values accepted' AS result;
          SQL
