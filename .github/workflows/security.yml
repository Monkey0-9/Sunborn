name: Security Audit & Supply-Chain Integrity

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 4 * * 1' # Weekly security audit on Mondays at 04:00 UTC

jobs:
  security-audit:
    name: Dependency Audit & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-bin

      - name: Install cargo-audit
        run: which cargo-audit || cargo install cargo-audit --locked

      - name: Audit Cargo Dependencies for Vulnerabilities
        run: cargo audit

      - name: Scan Secrets & Leakage Defense
        uses: trufflesecurity/trufflehog@v3.88.2
        with:
          path: ./
          extra_args: --only-verified

      - name: Frontend Dependency Vulnerability Check
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
