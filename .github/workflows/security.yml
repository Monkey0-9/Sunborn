name: Security Audit & Supply-Chain Integrity

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 4 * * 1' # Weekly security audit on Mondays at 04:00 UTC

jobs:
  security-audit:
    name: Dependency Audit & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-bin

      - name: Install cargo-audit
        run: which cargo-audit || cargo install cargo-audit --locked

      - name: Audit Cargo Dependencies for Vulnerabilities
        run: cargo audit

      - name: Scan Secrets & Leakage Defense
        uses: trufflesecurity/trufflehog@v3.88.2
        with:
          path: ./
          extra_args: --only-verified

      - name: Frontend Dependency Vulnerability Check (Complete Surface)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

      - name: Semgrep Static Application Security Testing (SAST)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
        continue-on-error: true

      - name: Kubernetes Manifest Security & Policy Verification
        run: |
          echo "Verifying absence of unencrypted plaintext secrets or default passwords in deploy/..."
          if grep -rn "change_me_in_secret" deploy/k8s/ > /dev/null 2>&1; then
            echo "ERROR: Found plaintext default in deploy/k8s/!"
            exit 1
          fi
          echo "PASS: Kubernetes manifests verified against static secret leakage."
