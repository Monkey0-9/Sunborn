name: Security Audit & Supply-Chain Integrity

permissions:
  contents: read

on:
  workflow_call:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: 0 4 * * 1 # Weekly security audit on Mondays at 04:00 UTC

jobs:
  security-audit:
    name: Dependency Audit & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo-audit binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-bin

      - name: Install cargo-audit
        run: which cargo-audit || cargo install cargo-audit --locked

      - name: Audit Cargo Dependencies for Vulnerabilities
        run: cargo audit

      - name: Scan Secrets & Leakage Defense
        uses: trufflesecurity/trufflehog@a94d152bf65bebf5baa486d3d4dfee520af2ceed # v3.88.2
        with:
          path: ./
          extra_args: --only-verified

      - name: Frontend Dependency Vulnerability Check (Complete Surface)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

      - name: Semgrep Static Application Security Testing (SAST)
        run: |
          python3 -m pip install --upgrade semgrep
          semgrep scan --config "p/security-audit" --config "p/secrets" --config "p/owasp-top-ten" --sarif --output semgrep.sarif --error

      - name: Upload Semgrep SARIF report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: error

      - name: Verify Semgrep Fixture Detection Gate
        run: python3 scripts/test_semgrep_gate.py

      - name: Kubernetes Manifest Security & Policy Verification
        if: always()
        run: python3 scripts/check_k8s_manifests.py
